# A complete device.conf: Xiaomi Mi Note 10 Lite (toco), the device this skill set was written from.
# Rendering the template with these values reproduces the toco tree (without its debug-kernel switches); diff the result
# against https://github.com/hesinj/orangefox-toco to see what a finished tree looks like.
# Facts marked [rom] come from the running ROM (scripts/collect_device_facts.sh), [boot] from unpack_bootimg of a stock
# boot/recovery image (scripts/unpack_and_inspect_boot.sh), [ref] from an official tree of the same SoC family.

# --- identity
DEVICE=toco                      # ro.product.device [rom]; lunch target becomes twrp_toco-eng
OEM=xiaomi                       # lower-case brand: the tree lives in device/xiaomi/toco
BRAND=Xiaomi
MODEL=Mi Note 10 Lite
MANUFACTURER=Xiaomi
MAINTAINER=toco-port
YEAR=2026

# --- platform
PLATFORM=sm6150                  # ro.board.platform [rom]
GPU=qcom-adreno618               # optional
HARDWARE=qcom                    # ro.hardware [rom]: names init.recovery.<HARDWARE>.rc and ueventd.<HARDWARE>.rc
QCOM=yes                         # yes = Qualcomm: adds device/qcom/twrp-common decryption packages
CPU_VARIANT_RUNTIME=cortex-a76
SHIPPING_API_LEVEL=29            # ro.product.first_api_level [rom]
AB=no                            # yes = A/B device (recovery-in-boot): NOT supported by the template, see the guide

# --- boot image [boot]
BOOT_HEADER_VERSION=2
PAGESIZE=4096
KERNEL_BASE=0x00000000
KERNEL_OFFSET=0x00008000
RAMDISK_OFFSET=0x01000000
SECOND_OFFSET=0x00f00000
TAGS_OFFSET=0x00000100
DTB_OFFSET=0x01f00000
KERNEL_CMDLINE="console=ttyMSM0,115200n8 earlycon=msm_geni_serial,0x880000 androidboot.hardware=qcom androidboot.console=ttyMSM0 service_locator.enable=1 lpm_levels.sleep_disabled=1 loop.max_part=7 androidboot.usbcontroller=a600000.dwc3 androidboot.dynamic_partitions=true androidboot.selinux=permissive"
PANIC_ZERO=yes                   # appends panic=0 (see references/test-ladder-and-safety.md)
KERNEL_PREBUILT=prebuilt/Image-pixelos.gz   # the ROM's own kernel binary, taken from its boot.img
ALT_KERNEL_PREBUILT=prebuilt/Image.gz       # optional: a second kernel selectable with FOX_ALT_KERNEL=true
DTB=prebuilt/dtb
DTBO=prebuilt/dtbo.img

# --- partitions (bytes) [rom: blockdev --getsize64 /dev/block/by-name/<name>]
RECOVERY_PARTITION_SIZE=134217728
BOOT_PARTITION_SIZE=134217728
DTBO_PARTITION_SIZE=33554432
CACHE_PARTITION_SIZE=402653184
DYNAMIC_PARTITIONS=yes
SUPER_SIZE=9126805504
SUPER_GROUP=qti_dynamic_partitions          # dump_super_partitions / lpdump [rom]
SUPER_PARTITION_LIST="system system_ext product vendor odm"
BOARD_ROOT_EXTRA_FOLDERS="bluetooth dsp firmware persist"
PARTITIONS="boot recovery cache metadata userdata misc dtbo modem bluetooth dsp modemst1 modemst2 fsc fsg persist"
USB_OTG_DEVICE=/dev/block/sdg

# --- userdata and encryption [rom: the userdata line of /vendor/etc/fstab.*]
USERDATA_FS=f2fs
F2FS_COMPRESSION=yes             # yes when the fstab has compress_extension= / fscompress
CRYPTO_MODE=fbe_metadata_wrapped # none | fde | fbe | fbe_metadata | fbe_metadata_wrapped
DATA_MNT_FLAGS="noatime,nosuid,nodev,nodiscard,reserve_root=32768,resgid=1065,fsync_mode=nobarrier,inlinecrypt,background_gc=sync,gc_merge,atgc,checkpoint_merge,compress_extension=apk,compress_extension=apex,compress_extension=so"
DATA_FS_MGR_FLAGS="latemount,wait,check,formattable,fileencryption=aes-256-xts:aes-256-cts:v2+inlinecrypt_optimized+wrappedkey_v0,metadata_encryption=aes-256-xts:wrappedkey_v0,keydirectory=/metadata/vold/metadata_encryption,fscompress,quota,reservedsize=128M,checkpoint=fs"
DATA_TWRP_FLAGS="fileencryption=aes-256-xts:aes-256-cts:v2+inlinecrypt_optimized+wrappedkey_v0,metadata_encryption=aes-256-xts:wrappedkey_v0,keydirectory=/metadata/vold/metadata_encryption,fscompress"
KEYMASTER_VERSIONS=4.1           # hal list of /vendor/etc/vintf/manifest.xml [rom]
GATEKEEPER_VERSION=1.0
WEAVER=no                        # yes on Pixel-class devices
VINTF_TARGET_LEVEL=5
VINTF_SEPOLICY=30.0
MOUNT_FIRMWARE=yes               # yes: mount FIRMWARE_PARTITION read-only at /vendor/firmware_mnt (Qualcomm trusted apps)
FIRMWARE_PARTITION=modem

# --- USB
USB_CONTROLLER=a600000.dwc3      # ls /sys/class/udc [rom]
USB_VID=0x2717
USB_PID=0xff60
USB_PID_MTP_ADB=0xff68

# --- display and input
SCREEN_W=1080
SCREEN_H=2340
PIXEL_FORMAT=RGBX_8888
TW_THEME=portrait_hdpi
BRIGHTNESS_PATH=/sys/class/backlight/panel0-backlight/brightness
MAX_BRIGHTNESS=2047
DEFAULT_BRIGHTNESS=1200
INPUT_BLACKLIST=hbtp_vm
HIDE_NOTCH=yes
